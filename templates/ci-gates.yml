# CI gates for agent-workflow projects — copy to <project>/.github/workflows/ci.yml
# Runs the same commands as the project's .gates.yml so local gates and CI
# can never drift apart. Adjust the toolchain version to your stack.

name: gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks needs history

      # --- toolchain: adjust to your stack -------------------------------
      # - uses: actions/setup-node@v4
      #   with: { node-version: "22", cache: npm }
      # - uses: dtolnay/rust-toolchain@stable
      #   with: { components: clippy, rustfmt }
      # - uses: actions/setup-go@v5
      #   with: { go-version: "stable" }

      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- keep in sync with .gates.yml ----------------------------------
      - name: lint
        run: echo "replace with the .gates.yml lint command"
      - name: typecheck
        run: echo "replace with the .gates.yml typecheck command"
      - name: build
        run: echo "replace with the .gates.yml build command"
      - name: test
        run: echo "replace with the .gates.yml test command"
      # - name: sast (stack audit — npm audit / cargo audit / gosec / semgrep)
      #   run: echo "replace with the .gates.yml sast stack-audit command"
      # - name: format check
      #   run: echo "replace with the .gates.yml format command"
