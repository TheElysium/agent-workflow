# Gate contract:
#   - Each non-ignored line is `key: single-line command`.
#   - Multi-line YAML values are NOT supported by the runner.
#   - `stack` is metadata and is not executed.
#   - Executed verbatim by gate-keeper locally and by scripts/run-gates.sh (bash) in CI.
#   - Each command runs with `bash -c` from the repo root, stdin /dev/null.
# Requires on PATH (gates + githooks/pre-commit): bash jq shellcheck gitleaks.
# Missing tool = FAIL, never a skip.
stack: shell
lint-sh: set -o pipefail; git ls-files -z --cached --others --exclude-standard -- '*.sh' githooks/pre-commit | sort -zu | xargs -0 shellcheck
test-sh: set -o pipefail; git ls-files -z --cached --others --exclude-standard -- '*.sh' | sort -zu | while IFS= read -r -d '' f; do case "$f" in .opencode/*) continue;; esac; case "${f##*/}" in test-*.sh) bash "$f" </dev/null || exit 1;; esac; done
modes: set -o pipefail; git ls-files -s -- '*.sh' githooks/pre-commit | { ! grep -v '^100755 '; }
sast: gitleaks detect --no-banner --redact
