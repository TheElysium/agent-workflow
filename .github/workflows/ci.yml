# CI gates for agent-workflow itself.
# Executes .gates.yml verbatim via scripts/run-gates.sh so local gates and CI
# can never drift apart.

name: gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks needs history

      # --- toolchain (shell stack) ---------------------------------------
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      # --- run the canonical gate definitions ----------------------------
      - name: Run gates
        run: bash scripts/run-gates.sh
